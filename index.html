<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cora's Handmade Beaded Earrings</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="cursor"></div>

<nav>
    <div class="nav-links">
        <a href="#order">How to Order</a>
    </div>
</nav>

<header class="hero">
    <h1>Cora's Handmade Beaded Earrings</h1>
</header>

<main>

<section class="collection">
    <div class="photos">
        <img src="photo1.jpeg" alt="Pearl Earrings">
        <img src="photo2.jpeg" alt="Pearl Earrings">
    </div>
    <h2>Pearls</h2>
</section>

<section class="collection">
    <div class="photos">
        <img src="photo3.jpeg" alt="Turquoise Earrings">
        <img src="photo4.jpeg" alt="Turquoise Earrings">
    </div>
    <h2>Turquoise</h2>
</section>

<section class="collection">
    <div class="photos">
        <img src="photo5.jpeg" alt="Aqua Earrings">
        <img src="photo6.jpeg" alt="Aqua Earrings">
    </div>
    <h2>Aqua</h2>
</section>

<section class="collection">
    <div class="photos">
        <img src="photo7.jpeg" alt="Blue Glass Earrings">
        <img src="photo8.jpeg" alt="Blue Glass Earrings">
    </div>
    <h2>Blue Glass</h2>
</section>

<section class="collection">
    <div class="photos">
        <img src="photo9.jpeg" alt="Black Earrings">
        <img src="photo10.jpeg" alt="Black Earrings">
    </div>
    <h2>Black</h2>
</section>

<section class="collection">
    <div class="photos">
        <img src="photo11.jpeg" alt="Clear Glass Earrings">
        <img src="photo12.jpeg" alt="Clear Glass Earrings">
    </div>
    <h2>Clear Glass</h2>
</section>

<section class="collection">
    <div class="photos">
        <img src="photo13.jpeg" alt="Pink Earrings">
        <img src="photo14.jpeg" alt="Pink Earrings">
    </div>
    <h2>Pink</h2>
</section>

</main>

<footer id="order">

    <h3>How to Order</h3>

    <p class="main-text">
        Fill out a paper order form and hand it in in person to Cora.
        Your earrings will be ready the next day!*
    </p>

    <p class="small">
        *If ordered on Friday there is a chance of delivery on that Tuesday.
    </p>

</footer>

<script>
const cursor = document.querySelector(".cursor");

document.addEventListener("mousemove", (e) => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
});
</script>

</body>
</html>
